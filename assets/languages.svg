<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Languages">
  <title>Languages of windacont-oss</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d1a"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: spinIn 1.6s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes spinIn { from { transform: rotate(-70deg) scale(.86); opacity: 0; } to { transform: rotate(0) scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </defs>

  <rect width="760" height="420" rx="18" fill="url(#card)" stroke="#1f2430"/>
  <rect x="0" y="0" width="760" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="36" y="54" font-family="'Cascadia Code','Consolas',monospace" font-size="19" fill="#22d3ee">⟩ languages</text>
  <text x="724" y="54" text-anchor="end" font-family="'Cascadia Code','Consolas',monospace" font-size="14" fill="#4b5563">53.6 MB of code</text>

  <g class="spin">
    <circle cx="210" cy="232" r="112" fill="none" stroke="#355570" stroke-width="34"
      stroke-linecap="butt" transform="rotate(-90 210 232)"
      stroke-dasharray="0 703.72" stroke-dashoffset="0.00">
      <animate attributeName="stroke-dasharray" from="0 703.72" to="593.48 110.24"
        dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline"
        keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </circle>
    <circle cx="210" cy="232" r="112" fill="none" stroke="#e34c26" stroke-width="34"
      stroke-linecap="butt" transform="rotate(-90 210 232)"
      stroke-dasharray="0 703.72" stroke-dashoffset="-596.48">
      <animate attributeName="stroke-dasharray" from="0 703.72" to="104.24 599.48"
        dur="1.1s" begin="0.24s" fill="freeze" calcMode="spline"
        keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </circle></g>

  <circle cx="210" cy="232" r="85" fill="#0b0a18" stroke="#1f2430" stroke-width="1"/>
  <text x="210" y="226" text-anchor="middle" font-family="'Segoe UI Black','Arial Black',sans-serif" font-size="26" font-weight="900" fill="#e5e7eb">GDScript</text>
  <text x="210" y="256" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#6b7280">top language</text>

  
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.50s" fill="freeze"/>
      <circle cx="404" cy="123" r="7" fill="#355570"/>
      <text x="424" y="128" font-family="'Cascadia Code','Consolas',monospace" font-size="17" fill="#c9d1d9">GDScript</text>
      <text x="724" y="128" text-anchor="end" font-family="'Cascadia Code','Consolas',monospace" font-size="17" fill="#6b7280">84.8%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.57s" fill="freeze"/>
      <circle cx="404" cy="161" r="7" fill="#e34c26"/>
      <text x="424" y="166" font-family="'Cascadia Code','Consolas',monospace" font-size="17" fill="#c9d1d9">HTML</text>
      <text x="724" y="166" text-anchor="end" font-family="'Cascadia Code','Consolas',monospace" font-size="17" fill="#6b7280">15.2%</text>
    </g>
</svg>
